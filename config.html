<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Configurações</title><link rel="stylesheet" href="config.css?v=20261002-1"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script></head><body><div class="container"><div class="topo"><button id="btnVoltar" class="btn-voltar">← Voltar</button><div><h1>Configurações</h1><span>Cadastros e mensagens</span></div></div><div id="status" class="status"></div><section class="card"><h2>Adicionar cadastro</h2><div class="grid"><div><label>Tipo</label><select id="tipoCadastro"><option value="EMPRESAS">Empresa</option><option value="EMAIL RESPOSTA">E-mail resposta</option><option value="SUPERVISORES">Supervisor</option><option value="REALIZADO POR">Realizado por</option></select></div><div><label>Valor</label><input id="valorCadastro" placeholder="Novo valor"></div></div><button id="btnCadastro" class="btn-principal">Adicionar</button></section><section class="card"><h2>Adicionar mensagem</h2><div class="grid"><div><label>Tipo</label><select id="tipoMensagem"><option value="email">E-mail</option><option value="sms">SMS</option></select></div><div><label>Nome da mensagem</label><input id="nomeMensagem"></div><div class="campo-largo"><label>Texto</label><textarea id="textoMensagem" rows="4"></textarea></div></div><button id="btnMensagem" class="btn-principal">Adicionar mensagem</button></section><section class="card"><h2>Limite SMS</h2><div class="grid"><div><label>Caracteres</label><input id="limite" type="number" min="1"></div></div><button id="btnLimite" class="btn-principal">Salvar limite</button></section></div><script src="config.js?v=20261005-2"></script></body></html>
