<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novo Registro - SMS</title>

    <link rel="stylesheet" href="app/styles/sms.css?v=20261002-2">

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

</head>

<body>

<div class="container">

    <div class="topo">

        <button id="btnVoltar" class="btn-voltar">
            ← Voltar
        </button>

        <div>
            <h1>Novo Registro</h1>
            <span>SMS</span>
        </div>

    </div>

    <div id="mensagemStatus" class="status"></div>

    <form id="formSms">

        <div class="campo">

            <label for="realizadoPor">
                Realizado por
            </label>

            <input
                type="text"
                id="realizadoPor"
                list="listaRealizadoPor"
                placeholder="Realizado por">

            <datalist id="listaRealizadoPor"></datalist>
            <small id="statusUsuario" class="ajuda-usuario">Identificação automática do usuário Microsoft 365.</small>

        </div>

        <div class="campo">

            <label for="empresa">
                Empresa *
            </label>

            <input
                type="text"
                id="empresa"
                list="listaEmpresas"
                placeholder="Digite ou selecione a empresa"
                required>

            <datalist id="listaEmpresas"></datalist>

        </div>

        <div class="campo">

            <label for="qtde">
                Qtde *
            </label>

            <input
                type="number"
                id="qtde"
                min="1"
                step="1"
                placeholder="Quantidade"
                required>

        </div>

        <div class="campo">

            <label for="supervisor">
                Supervisor *
            </label>

            <input
                type="text"
                id="supervisor"
                list="listaSupervisores"
                placeholder="Digite ou selecione o supervisor"
                required>

            <datalist id="listaSupervisores"></datalist>

        </div>

        <div class="campo">

            <label for="obs">
                Observação
            </label>

            <textarea
                id="obs"
                rows="3"
                placeholder="Observação"></textarea>

        </div>

        <div class="campo">

            <label for="historicoExterno">
                Histórico Externo *
            </label>

            <textarea
                id="historicoExterno"
                rows="3"
                placeholder="Informe o histórico externo"
                required></textarea>

        </div>

        

        <div class="campo">

            <label for="mensagem">
                Mensagem *
            </label>

            <select id="mensagem" required>

                <option value="">
                    Carregando mensagens...
                </option>

            </select>

        </div>

        <div class="campo">

            <div class="linha-mensagem">

                <label for="textoMensagem">
                    Texto da mensagem
                </label>

                <span id="contador">
                    0 / 160
                </span>

            </div>

            <textarea
                id="textoMensagem"
                rows="5"
                readonly
                placeholder="O texto da mensagem aparecerá aqui"></textarea>

        </div>

        <div class="botoes">

            <button
                type="button"
                id="btnCancelar"
                class="btn-cancelar">
                Cancelar
            </button>

            <button
                type="submit"
                id="btnSalvar"
                class="btn-salvar">
                Salvar
            </button>

        </div>

    </form>

</div>

<script src="app/scripts/sms.js?v=20261005-5"></script>

</body>
</html>
