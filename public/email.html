<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novo registro - E-mail</title>

    <link rel="stylesheet" href="email.css?v=20261123-1">

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

<link rel="stylesheet" href="brand.css?v=alpha215"><script src="brand.js?v=alpha20-hml2"></script><script src="registro-security.js?v=20261126"></script><script src="feedback.js?v=alpha206"></script><script src="form-layout.js?v=alpha206"></script><script src="personal-prefs.js?v=alpha215"></script></head>

<body>

<div class="container">

    <div class="topo">

        <button id="btnVoltar" class="btn-voltar">
            ← Voltar
        </button>

        <div>
            <h1>Novo registro</h1>
            <span>E-mail</span>
        </div>

    </div>

    <details class="config-connection" open><summary>Conexão com Config</summary><div id="configLog" role="status" aria-live="polite"></div></details><div id="mensagemStatus" class="status"></div>

    <form id="formEmail" novalidate>

        <div class="campo">

            <label for="realizadoPor">
                Realizado por <span style="color:var(--brand-error,#b00020)" aria-hidden="true">*</span>
            </label>

            <input
                type="text"
                id="realizadoPor"
                list="listaRealizadoPor"
                placeholder="Realizado por" required aria-required="true">

            <datalist id="listaRealizadoPor"></datalist>
            <small id="statusUsuario" class="ajuda-usuario">Identificação automática do usuário Microsoft 365.</small>

        </div>

        <div class="campo">

            <label for="empresa">
                Empresa <span style="color:var(--brand-error,#b00020)" aria-hidden="true">*</span>
            </label>

            <input
                type="text"
                id="empresa"
                list="listaEmpresas"
                placeholder="Digite ou selecione a empresa"
                required>

            <datalist id="listaEmpresas"></datalist>

        </div>

        <div class="campo">

            <label for="qtde">
                Qtde <span style="color:var(--brand-error,#b00020)" aria-hidden="true">*</span>
            </label>

            <input
                type="number"
                id="qtde"
                min="1"
                step="1"
                placeholder="Quantidade"
                required>

        </div>

        <div class="campo">

            <label for="emailResposta">
                E-mail Resposta <span style="color:var(--brand-error,#b00020)" aria-hidden="true">*</span>
            </label>

            <input
                type="email"
                id="emailResposta"
                list="listaEmails"
                placeholder="Digite ou selecione o e-mail"
                required>

            <datalist id="listaEmails"></datalist>

        </div>

        <div class="campo">

            <label for="supervisor">
                Supervisor <span style="color:var(--brand-error,#b00020)" aria-hidden="true">*</span>
            </label>

            <input
                type="text"
                id="supervisor"
                list="listaSupervisores"
                placeholder="Digite ou selecione o supervisor"
                required>

            <datalist id="listaSupervisores"></datalist>

        </div>

        <div class="campo">

            <label for="obs">
                Observação
            </label>

            <textarea
                id="obs"
                rows="3"
                placeholder="Observação"></textarea>

        </div>

        <div class="campo">

            <label for="historicoExterno">
                Histórico Externo <span style="color:var(--brand-error,#b00020)" aria-hidden="true">*</span>
            </label>

            <textarea
                id="historicoExterno"
                rows="4"
                placeholder="Informe o histórico externo"
                required></textarea>

        </div>

        <div class="campo">

            <label for="mensagem">
                Mensagem <span style="color:var(--brand-error,#b00020)" aria-hidden="true">*</span>
            </label>

            <select id="mensagem" required>

                <option value="">
                    Carregando mensagens...
                </option>

            </select>

        </div>

        <div class="campo">

            <label for="textoMensagem">
                Texto da mensagem
            </label>

            <textarea
                id="textoMensagem"
                rows="5"
                readonly
                placeholder="O texto da mensagem aparecerá aqui"></textarea>

        </div>

        

        <div class="campo">

            <label for="assunto">
                Assunto <span style="color:var(--brand-error,#b00020)" aria-hidden="true">*</span>
            </label>

            <input
                type="text"
                id="assunto"
                placeholder="Assunto"
                required>

        </div>

        <div id="perguntasPersonalizadas"></div>

        <div class="botoes">

            <button
                type="button"
                id="btnCancelar"
                class="btn-cancelar">
                Cancelar
            </button>

            <button
                type="submit"
                id="btnSalvar"
                class="btn-salvar">
                Salvar
            </button>

        </div>

    </form>

</div>

<script src="perguntas.js?v=alpha215"></script>
<script src="email.js?v=alpha215"></script>

</body>
</html>
