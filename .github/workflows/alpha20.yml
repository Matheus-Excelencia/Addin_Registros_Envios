name: Alpha 2.0 validation
on:
  push:
    branches: [feat/alpha-2.0]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -r -n1 node --check
      - run: node scripts/sync-demo.cjs --check
      - run: node --test tests/*.test.cjs
