<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registros de Envios</title><link rel="stylesheet" href="taskpane.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script></head><body><div class="app"><header><h1>Novo registro</h1><p>Envio por Email</p></header><main><form id="emailForm">
<label>Realizado por <span>*</span><input id="realizadoPor" readonly placeholder="Identificando..."></label>
<label>Empresa <span>*</span><input id="empresa" list="empresas" required placeholder="Selecione ou digite"><datalist id="empresas"></datalist></label>
<label>Qtde <span>*</span><input id="qtde" type="number" min="1" step="1" required></label>
<label>Email Resposta <span>*</span><input id="emailResposta" list="emailsResposta" required placeholder="Selecione ou digite"><datalist id="emailsResposta"></datalist></label>
<label>Supervisor <span>*</span><input id="supervisor" list="supervisores" required placeholder="Selecione ou digite"><datalist id="supervisores"></datalist></label>
<label>Obs<textarea id="obs" rows="2"></textarea></label>
<label>Histórico Externo <span>*</span><textarea id="historicoExterno" rows="3" required></textarea></label>
<label>Mensagem <span>*</span><select id="mensagem" required><option value="">Selecione...</option></select></label>
<label>Assunto <span>*</span><input id="assunto" required></label><div id="status"></div>
<div class="actions"><button type="button" id="cancelar">Cancelar</button><button type="submit" id="salvar">Salvar registro</button></div>
</form></main></div><script src="taskpane.js"></script></body></html>
