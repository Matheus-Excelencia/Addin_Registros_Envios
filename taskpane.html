<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Registro</title>

    <link rel="stylesheet" href="taskpane.css?v=20261002-1">

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>

    <div class="container">

        <div class="cabecalho">
            <h1>Novo Registro</h1>
            <p>Escolha o tipo de registro</p>
        </div>

        <div class="card">

            <label for="tipoRegistro">
                Tipo de registro
            </label>

            <select id="tipoRegistro">
                <option value="email">E-mail</option>
                <option value="sms">SMS</option>
            </select>

            <button id="btnContinuar" class="btn-principal">
                Continuar
            </button>

        </div>

    </div>

    <script src="taskpane.js?v=20261002-1"></script>

</body>
</html>
