<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Configurações</title><link rel="stylesheet" href="../config.css?v=20261124-ux004"><script src="office-mock.js"></script></head><body><div class="container"><div class="topo"><button id="btnVoltar" class="btn-voltar">← Voltar</button><div><h1>Configurações</h1><span>Cadastros e mensagens</span></div></div><div id="status" class="status"></div><section class="card"><h2>Adicionar cadastro</h2><div class="grid"><div><label>Tipo</label><select id="tipoCadastro"><option value="EMPRESAS">Empresa</option><option value="EMAIL RESPOSTA">E-mail resposta</option><option value="SUPERVISORES">Supervisor</option><option value="REALIZADO POR">Realizado por</option></select></div><div><label>Valor</label><input id="valorCadastro" placeholder="Novo valor"></div></div><button id="btnCadastro" class="btn-principal">Adicionar</button></section><section class="card"><h2>Adicionar mensagem</h2><div class="grid"><div><label>Tipo</label><select id="tipoMensagem"><option value="email">E-mail</option><option value="sms">SMS</option></select></div><div><label>Nome da mensagem</label><input id="nomeMensagem"></div><div class="campo-largo"><label>Texto</label><textarea id="textoMensagem" rows="4"></textarea><div id="contadorMensagemSMS" class="contador-sms" hidden aria-live="polite"></div></div></div><button id="btnMensagem" class="btn-principal">Adicionar mensagem</button></section><section class="card">
<h2>Perguntas personalizadas</h2>
<div id="editorPergunta"><p>Crie perguntas que serão exibidas nos formulários e gravadas junto com cada registro.</p>
<div class="grid">
<div><label for="perguntaNome">Pergunta</label><input id="perguntaNome" maxlength="100" placeholder="Ex.: Qual valor total dos processos?"></div>
<div><label for="perguntaFormulario">Exibir em</label><select id="perguntaFormulario"><option value="ambos">E-mail e SMS</option><option value="email">Somente E-mail</option><option value="sms">Somente SMS</option></select></div>
<div><label for="perguntaTipo">Tipo de resposta</label><select id="perguntaTipo"><option value="text">Texto (todos os caracteres)</option><option value="int">Número inteiro (int)</option><option value="float" selected>Número decimal (float)</option><option value="date">Data</option><option value="time">Hora</option><option value="datetime">Data e hora</option><option value="bool">Sim/Não</option></select></div>
<div><label for="perguntaFormato">Formato no Excel</label><select id="perguntaFormato"><option value="geral">Geral</option><option value="texto">Texto</option><option value="inteiro">Inteiro</option><option value="decimal">Decimal (2 casas)</option><option value="decimal4">Decimal (4 casas)</option><option value="contabil" selected>Contábil (R$)</option><option value="moeda">Moeda (R$)</option><option value="percentual">Porcentagem</option><option value="data">Data (dd/mm/aaaa)</option><option value="hora">Hora (hh:mm)</option><option value="datahora">Data e hora</option></select></div><div><label for="perguntaColuna">Nome da coluna no Excel (opcional)</label><input id="perguntaColuna" maxlength="100" placeholder="Ex.: Valor"></div><div><label for="perguntaObrigatoria">Obrigatoriedade</label><select id="perguntaObrigatoria"><option value="nao">Opcional</option><option value="sim">Obrigatória</option></select></div>
</div>
<button id="btnPergunta" class="btn-principal">Adicionar pergunta</button>
<div id="statusPergunta" class="status" role="alert" aria-live="assertive"></div>
</div><div id="listaPerguntas" class="lista-perguntas"></div>
</section><section class="card"><h2>Limite SMS</h2><div class="grid"><div><label>Caracteres</label><input id="limite" type="number" min="1"></div></div><button id="btnLimite" class="btn-principal">Salvar limite</button></section></div><script src="../config.js?v=20261124-ux004"></script></body></html>
