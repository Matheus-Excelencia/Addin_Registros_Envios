<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel simulado — Registros de Envios</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f4f8f6;color:#16382f}header{background:#087f72;color:white;padding:15px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}button{font:inherit;cursor:pointer;padding:8px;border:1px solid #b7d0c7;border-radius:5px;background:white;color:#16483e}nav{padding:10px;display:flex;gap:6px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100vh - 120px);min-height:550px}.sheet{overflow:auto;background:white;border:1px solid #d0ded6}table{border-collapse:collapse;font-size:12px}td,th{border:1px solid #d4e1da;min-width:100px;padding:8px;white-space:nowrap}th{background:#e0eee7}td:focus{outline:2px solid #087f72}tr.active{background:#c9f3e1}iframe{width:100%;height:100%;border:0;border-left:1px solid #b7d0c7}@media(max-width:750px){.layout{grid-template-columns:1fr;height:auto}.sheet{height:260px}iframe{height:650px}} :root{color-scheme:light;--surface:#fff;--bg:#f0f7f6;--ink:#14302f;--line:#cfe0df;--head:#e0f0eb}html[data-theme=dark]{color-scheme:dark;--surface:#152e35;--bg:#0b171c;--ink:#e6f3f1;--line:#345057;--head:#12272d}body{background:var(--bg);color:var(--ink)}header{background:#124b60;align-items:center}header img{width:30px;vertical-align:middle;margin-right:8px}nav{background:var(--surface);border-bottom:1px solid var(--line)}button{background:var(--surface);color:var(--ink);border-color:var(--line);transition:background .2s}button[aria-current=true]{background:#087f72;color:white} .sheet{background:var(--surface);border-color:var(--line)}td,th{border-color:var(--line)}th{background:var(--head);position:sticky;top:0}tr:nth-child(2){background:var(--head);font-weight:700}tr.active{background:#087f7233}td{max-width:240px;overflow:hidden;text-overflow:ellipsis}iframe{border-color:var(--line)}.layout{min-height:440px;height:calc(100vh - 105px)}</style><header><strong><img src="../assets/brand-registros.svg" alt=""> Registros de Envios.xlsx — Simulação</strong><span>Dados fictícios · sessão local</span><button id="reset">Reiniciar</button></header><nav><button data-sheet="Email">Email</button><button data-sheet="SMS">SMS</button><button data-sheet="Config">Config</button><button id="menu">Novo Registro / Menu</button></nav><div class="layout"><div class="sheet"><table id="grid"></table></div><iframe id="pane" title="Interface original do suplemento" src="taskpane.html"></iframe></div><script>function theme(){document.documentElement.dataset.theme=localStorage.getItem("registros.theme")||"light"}theme();window.addEventListener("storage",theme);const key="demoWorkbookV1";let current="Email",selected=-1;const grid=document.getElementById("grid"),pane=document.getElementById("pane");function render(){document.querySelectorAll("[data-sheet]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.sheet===current)));let db;try{db=JSON.parse(sessionStorage.getItem(key))}catch{}if(!db)return;grid.replaceChildren();const data=db[current],width=Math.max(12,...data.map(r=>r.length));const head=grid.insertRow();for(let c=-1;c<width;c++){const th=document.createElement("th");th.textContent=c<0?"#":String.fromCharCode(65+c);head.append(th)}for(let i=0;i<Math.max(15,data.length);i++){const tr=grid.insertRow();if(i===selected)tr.className="active";tr.insertCell().textContent=i+1;for(let c=0;c<width;c++){const td=tr.insertCell();td.textContent=data[i]?.[c]??"";td.contentEditable="true";td.onblur=()=>{const latest=JSON.parse(sessionStorage.getItem(key));while(latest[current].length<=i)latest[current].push([]);latest[current][i][c]=td.textContent;sessionStorage.setItem(key,JSON.stringify(latest));pane.src=pane.contentWindow.location.href}}}}document.querySelectorAll("[data-sheet]").forEach(b=>b.onclick=()=>{current=b.dataset.sheet;selected=-1;render()});document.getElementById("menu").onclick=()=>pane.src="taskpane.html";document.getElementById("reset").onclick=()=>{for(const k of ["demoWorkbookV1","registroDuplicado","splash106","splash20"])sessionStorage.removeItem(k);for(const k of Object.keys(sessionStorage))if(k.startsWith("registros.volume")||k.startsWith("registros.visibility.")||k==="registros.summaryView"||k==="registros.showValue")sessionStorage.removeItem(k);current="Email";selected=-1;grid.replaceChildren();pane.src="taskpane.html?reset="+Date.now()};window.addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==pane.contentWindow)return;if(e.data?.type==="demo-select"){current=e.data.name;selected=e.data.row}if(e.data?.type==="demo-workbook"||e.data?.type==="demo-select")render()});render();</script></html>
